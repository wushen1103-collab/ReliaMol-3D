[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliamol3d"
version = "0.1.0"
description = "Reliability-oriented information fusion for auditing and reranking 3D structure-based molecular generation outputs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "torch>=2.1",
    "tqdm>=4.66",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
